name: Build WeiboPocket Plugin

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'xmake.lua'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  QT_VERSION: "5.15.2"
  TARGET_ARCH: "arm64-v8a"
  CROSS_PREFIX: "aarch64-linux-gnu"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git wget unzip zip python3

      - name: Install xmake
        run: |
          curl -fsSL https://xmake.io/shget.text | bash
          source ~/.xmake/profile
          xmake --version

      - name: Install zig cross toolchain
        run: |
          wget -q https://ziglang.org/download/0.11.0/zig-linux-x86_64-0.11.0.tar.xz
          tar -xf zig-linux-x86_64-0.11.0.tar.xz
          sudo mv zig-linux-x86_64-0.11.0 /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH
          zig version

      - name: Clone Qt 5.15.2 for aarch64
        run: |
          git clone --depth 1 https://github.com/Redbeanw44602/aarch64-linux-qt-5.15.2.git /tmp/qt-aarch64
          ls -la /tmp/qt-aarch64/

      - name: Configure xmake
        run: |
          source ~/.xmake/profile
          xmake f -c \
            --qt="/tmp/qt-aarch64" \
            --arch=arm64-v8a \
            --toolchain=zigcc \
            --cross=aarch64-linux-gnu.2.27 \
            -m release -vD

      - name: Build plugin
        run: |
          source ~/.xmake/profile
          xmake -v

      - name: Strip debug symbols
        run: |
          if [ -f build/linux/arm64-v8a/release/libweibo_plugin.so ]; then
            /opt/zig/zig strip build/linux/arm64-v8a/release/libweibo_plugin.so || true
            ls -lh build/linux/arm64-v8a/release/libweibo_plugin.so
          else
            echo "ERROR: libweibo_plugin.so not found!"
            find build -name "*.so" 2>/dev/null || true
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libweibo_plugin
          path: build/linux/arm64-v8a/release/libweibo_plugin.so
          retention-days: 30
